<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel de Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Encabezado -->
    <header class="text-center py-2">
      <h1 class="text-3xl font-bold text-gray-800">Panel de Finanzas Personal</h1>
    </header>

    <!-- Tarjetas de Saldo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="p-4 bg-white rounded-lg shadow border-l-4 border-green-500">
        <p class="text-xs font-semibold text-gray-500 uppercase">Ingresos</p>
        <p id="total-ingresos" class="text-2xl font-bold text-gray-800">0.00 €</p>
      </div>
      <div class="p-4 bg-white rounded-lg shadow border-l-4 border-red-500">
        <p class="text-xs font-semibold text-gray-500 uppercase">Gastos</p>
        <p id="total-gastos" class="text-2xl font-bold text-gray-800">0.00 €</p>
      </div>
      <div class="p-4 bg-white rounded-lg shadow border-l-4 border-blue-500">
        <p class="text-xs font-semibold text-gray-500 uppercase">Saldo Total</p>
        <p id="saldo-total" class="text-2xl font-bold text-gray-800">0.00 €</p>
      </div>
    </div>

    <!-- Bloque en dos columnas: Categorías y Nueva Transacción -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Gestión de Categorías -->
      <div class="p-6 bg-white rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4 text-gray-700">Gestión de Categorías</h3>
        <form id="form-categoria" class="flex gap-2 mb-4">
          <input type="text" id="nombre-categoria" placeholder="Nombre de categoría" required class="border p-2 rounded flex-1">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-semibold">Añadir</button>
        </form>
        <ul id="lista-categorias" class="space-y-2"></ul>
      </div>

      <!-- Nueva Transacción -->
      <div class="p-6 bg-white rounded-lg shadow">
        <h3 class="text-lg font-bold mb-4 text-gray-700">Nueva Transacción</h3>
        <form id="form-transaccion" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Concepto</label>
            <input type="text" id="concepto" placeholder="Ej. Compras" required class="border p-2 rounded w-full">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Monto (€)</label>
            <input type="number" step="0.01" id="monto" placeholder="0.00" required class="border p-2 rounded w-full">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Tipo</label>
              <select id="tipo" class="border p-2 rounded w-full">
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Categoría</label>
              <select id="categoria-select" class="border p-2 rounded w-full">
                <option value="">Sin categoría</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold p-2 rounded transition mt-2">
            Guardar Transacción
          </button>
        </form>
      </div>

    </div>

    <!-- Historial de Transacciones (Ancho completo abajo) -->
    <div class="p-6 bg-white rounded-lg shadow">
      <h3 class="text-lg font-bold mb-4 text-gray-700">Historial de Transacciones</h3>
      <ul id="lista-transacciones" class="space-y-2"></ul>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
