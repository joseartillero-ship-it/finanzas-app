<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Auth Section / Navigation Bar -->
    <header class="bg-white shadow py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Finance Manager</h1>
        <div id="auth-container" class="flex items-center gap-4">
            <!-- Dynamic Login/Logout state -->
            <span id="user-email" class="text-sm text-gray-600"></span>
            <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm transition">Sign Out</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto mt-8 px-4">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Personal Finance Dashboard</h2>

        <!-- Expense Chart Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">Expenses by Category</h3>
            <div class="relative w-full h-64">
                <canvas id="graficoGastos"></canvas>
            </div>
        </div>

        <!-- Add transaction or other app components go here -->
    </main>

    <script src="app.js"></script>
</body>
</html>
