<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Panel de Finanzas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="container">
    <header class="app-header">
      <h1>Panel de Finanzas Personal</h1>
      <div id="auth" class="auth-box">
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btn-login" class="btn btn-primary">Iniciar sesión</button>
        <button id="btn-signup" class="btn btn-secondary">Registrarse</button>
        <button id="btn-logout" class="btn btn-danger" style="display:none;">Cerrar sesión</button>
        <p id="auth-status" class="status-message"></p>
      </div>
    </header>

    <main id="app">
      <!-- Tarjetas del Resumen Financiero -->
      <section class="summary-section">
        <div class="card card-income">
          <h3>Ingresos</h3>
          <p class="amount"><span id="total-ingresos">0.00</span> €</p>
        </div>
        <div class="card card-expense">
          <h3>Gastos</h3>
          <p class="amount"><span id="total-gastos">0.00</span> €</p>
        </div>
        <div class="card card-balance">
          <h3>Saldo Total</h3>
          <p class="amount"><span id="saldo-total">0.00</span> €</p>
        </div>
      </section>

      <div class="grid-layout">
        <!-- Sección de Categorías -->
        <section class="panel">
          <h2>Gestión de Categorías</h2>
          <form id="form-categoria" class="form-row">
            <input type="text" id="nombre-categoria" placeholder="Nombre de categoría" required>
            <button type="submit" class="btn btn-primary">Añadir</button>
          </form>
          <ul id="lista-categorias" class="item-list"></ul>
        </section>

 <!-- Formulario Nueva Transacción -->
<div class="card bg-white p-6 rounded-lg shadow-md mb-6">
  <h2 class="text-xl font-semibold mb-4 text-gray-700">Nueva Transacción</h2>
  <form id="form-transaccion" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Concepto</label>
        <input 
          type="text" 
          id="concepto" 
          placeholder="Ej: Compra supermercado" 
          required 
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Monto (€)</label>
        <input 
          type="number" 
          step="0.01" 
          id="monto" 
          placeholder="0.00" 
          required 
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Tipo</label>
        <select 
          id="tipo" 
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
        >
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Categoría</label>
        <select 
          id="categoria-select" 
          class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
        >
          <option value="">Sin categoría</option>
        </select>
      </div>
    </div>

    <button 
      type="submit" 
      class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded transition-colors"
    >
      Guardar Transacción
    </button>
  </form>
</div>

<!-- Tabla Historial de Transacciones -->
<div class="card bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-semibold mb-4 text-gray-700">Historial de Transacciones</h2>
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
          <th class="p-3">Concepto</th>
          <th class="p-3">Monto</th>
          <th class="p-3">Tipo</th>
          <th class="p-3">Categoría</th>
          <th class="p-3 text-right">Acción</th>
        </tr>
      </thead>
      <tbody id="lista-transacciones">
        <!-- Se rellena dinámicamente desde app.js -->
      </tbody>
    </table>
  </div>
</div>
<!-- Formulario para añadir transacción con categorías -->
  <div class="p-4 bg-white rounded-lg shadow mb-6">
    <h3 class="text-lg font-bold mb-3">Nueva Transacción</h3>
    <form id="form-transaccion" class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <input type="text" id="concepto" placeholder="Concepto (ej. Compras)" required class="border p-2 rounded">
      <input type="number" step="0.01" id="monto" placeholder="Monto (€)" required class="border p-2 rounded">
      
      <select id="tipo" class="border p-2 rounded">
        <option value="gasto">Gasto</option>
        <option value="ingreso">Ingreso</option>
      </select>

      <!-- Selector dinámico de categorías -->
      <select id="categoria-select" class="border p-2 rounded">
        <option value="">Sin categoría</option>
      </select>

      <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 md:col-span-4 font-semibold">
        Guardar Transacción
      </button>
    </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
