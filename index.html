<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="data:,">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Auth Section / Navigation Bar -->
    <header class="bg-white shadow py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800">Finance Manager</h1>
        <div class="flex items-center gap-4">
            <!-- Dynamic Login/Logout state -->
            <span id="user-email" class="text-sm text-gray-600">Sign in or register to save your data</span>
            
            <!-- Auth Forms / Inputs -->
            <div id="auth-forms" class="flex items-center gap-2">
                <input type="email" id="email" placeholder="Email" class="border rounded px-2 py-1 text-sm">
                <input type="password" id="password" placeholder="Password" class="border rounded px-2 py-1 text-sm">
                <button id="btn-login" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium">Sign In</button>
                <button id="btn-signup" class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-1 rounded text-sm font-medium">Register</button>
            </div>

            <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm font-medium hidden">Sign Out</button>
        </div>
    </header>

    <!-- Main Content -->
<main class="max-w-6xl mx-auto mt-10 px-4 grid grid-cols-1 md:grid-cols-3 gap-8">

    <!-- Left Column: Totals & Forms -->
    <div class="md:col-span-1 space-y-6">
        
        <!-- Summary Card -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-800 uppercase tracking-wider mb-4 flex items-center justify-between">
                Financial Summary
                <span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-full font-semibold">Live</span>
            </h3>
            <div class="space-y-4">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                    <span class="text-gray-500 text-sm font-medium">Total Income:</span>
                    <span id="total-ingresos" class="text-emerald-600 font-extrabold text-lg">$0.00</span>
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                    <span class="text-gray-500 text-sm font-medium">Total Expenses:</span>
                    <span id="total-gastos" class="text-rose-600 font-extrabold text-lg">$0.00</span>
                </div>
                <div class="pt-2 border-t border-gray-100 flex justify-between items-center px-1">
                    <span class="text-gray-700 font-bold">Net Balance:</span>
                    <span id="saldo-total" class="text-gray-900 font-black text-xl">$0.00</span>
                </div>
            </div>
        </div>

        <!-- Add Category Form -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-800 uppercase tracking-wider mb-4">Manage Categories</h3>
            <form id="form-categoria" class="space-y-3">
                <input type="text" id="nombre-categoria" placeholder="Category name" required 
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md hover:shadow-lg">
                    Add Category
                </button>
            </form>
            <ul id="lista-categorias" class="mt-4 space-y-2 max-h-40 overflow-y-auto"></ul>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-800 uppercase tracking-wider mb-4">New Transaction</h3>
            <form id="form-transaccion" class="space-y-3">
                <input type="text" id="concepto-transaccion" placeholder="Concept / Description" required 
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                <input type="number" step="0.01" id="monto-transaccion" placeholder="Amount ($)" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                <input type="date" id="fecha-transaccion" required
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all text-gray-600">
                <select id="tipo-transaccion" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all bg-white">
                    <option value="Gasto">Expense</option>
                    <option value="Ingreso">Income</option>
                </select>
                <select id="categoria-transaccion" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all bg-white">
                    <option value="">No category</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md hover:shadow-lg">
                    Save Transaction
                </button>
            </form>
        </div>

    </div>

    <!-- Right Column: Chart & Transaction History -->
    <div class="md:col-span-2 space-y-6">
        
        <!-- Expense Chart Section -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-800 uppercase tracking-wider mb-4">Expenses by Category</h3>
            <div class="relative w-full h-80 flex items-center justify-center">
                <canvas id="graficogastos"></canvas>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
            <h3 class="text-base font-bold text-gray-800 uppercase tracking-wider mb-4">Transaction History</h3>
            <ul id="lista-transacciones" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                <li class="p-4 text-center text-gray-400 text-sm">No transactions recorded yet</li>
            </ul>
        </div>

    </div>

</main>

    <!-- Main JS Application Script -->
    <script src="app.js"></script>
</body>
</html>
